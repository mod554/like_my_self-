[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brvm-portefeuille"
version = "0.1.0"
description = "Suivi et analyse technique de portefeuille sur la BRVM (UEMOA)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pandas>=2.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Dépendances ajoutées couche par couche, au moment où elles servent réellement.
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "types-PyYAML>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brvm = ["storage/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # accents et apostrophes typographiques assumés
