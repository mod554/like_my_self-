# ==============================================================================
#  Configuration unique du suivi de portefeuille BRVM
# ==============================================================================
#
#  Copiez ce fichier en `config.yaml` puis renseignez les champs marqués
#  « À RENSEIGNER ». Ils sont volontairement laissés vides : le système refuse de
#  démarrer tant qu'ils le sont, plutôt que de calculer sur une valeur inventée.
#
#  Deux catégories de paramètres :
#
#    [FAIT]        Une information que seul vous pouvez fournir : barème de votre
#                  SGI, taux de fiscalité, seuil réglementaire, adresse d'une
#                  source. Le système n'en propose aucune valeur.
#
#    [PRÉFÉRENCE]  Un choix de votre part : limites de risque, fenêtres de calcul.
#                  Une valeur de départ est proposée ci-dessous ; ajustez-la.
#
#  Convention des taux : tous les taux sont des FRACTIONS, jamais des
#  pourcentages. 0,6 % s'écrit 0.006. Un taux supérieur à 1 est rejeté.
#
#  Devise : XOF exclusivement. Aucune conversion n'est effectuée nulle part.
# ==============================================================================

general:
  devise: XOF
  # Fuseau d'affichage. Les horodatages sont stockés en UTC.
  fuseau_horaire: Africa/Abidjan
  repertoire_donnees: ../data
  base_donnees: ../data/brvm.sqlite3
  # PMP (prix moyen pondéré) ou FIFO. Le moteur calcule les deux ; ce paramètre
  # fixe la méthode affichée par défaut.
  methode_valorisation: PMP
  # HALF_UP est l'arrondi commercial usuel : 0,5 est arrondi au-dessus.
  mode_arrondi: HALF_UP

marche:
  # Pays de la place de cotation : ses jours fériés ferment la bourse.
  pays_place: CI
  # Univers suivi. Voir univers.exemple.csv pour le format attendu.
  fichier_univers: ./univers.csv
  # [FAIT] À RENSEIGNER — seuil réglementaire de variation d'un cours sur une
  # séance, en fraction (0.075 pour ±7,5 %). À relever dans les textes en vigueur
  # de l'entreprise de marché. Sert à détecter une cotation aberrante à
  # l'ingestion : un seuil inventé rendrait cette détection fausse.
  seuil_variation_journaliere:
  # Heure locale de clôture, pour juger de la fraîcheur d'une donnée.
  heure_cloture_locale: "15:00"

calendrier:
  # 0 = lundi … 6 = dimanche.
  jours_ouvres: [0, 1, 2, 3, 4]
  # Période sur laquelle le calendrier est réputé complet. Hors de cette période,
  # le système refuse de dire si un jour est une séance.
  couverture_debut: 2024-01-01
  couverture_fin: 2026-12-31
  # [FAIT] Jours fériés par pays. Voir jours_feries.exemple.yaml.
  fichier_feries: ./jours_feries.yaml
  # Fermetures ponctuelles annoncées par l'entreprise de marché.
  fermetures_exceptionnelles: []

# ------------------------------------------------------------------------------
#  Sources de données
# ------------------------------------------------------------------------------
#  Il n'existe pas de flux temps réel public et gratuit sur cette place. « Temps
#  réel » signifie ici : dernière donnée disponible, horodatée, avec son âge.
#
#  Les connecteurs réseau sont livrés INACTIFS et sans URL : aucune adresse ni
#  aucune structure de page n'a été vérifiée par le système. Renseignez l'URL que
#  vous avez vous-même constatée, vérifiez les conditions d'utilisation et le
#  robots.txt du site, puis passez `actif: true`.
# ------------------------------------------------------------------------------
sources:
  - nom: fichier_manuel
    type: fichier_csv
    actif: true
    priorite: 1
    url_base:
    # Fichier de secours que vous alimentez à la main (ou par export de votre SGI).
    chemin_fichier: ../data/cotations_manuelles.csv
    timeout_s: 30
    tentatives_max: 1
    backoff_initial_s: 1
    backoff_facteur: 2
    respecter_robots: true
    cache_minutes: 0
    age_max_minutes: 1440

  - nom: brvm_cote_du_jour
    type: web
    actif: false          # [FAIT] passez à true une fois url_base ET analyseur renseignés
    priorite: 2
    url_base:             # À RENSEIGNER — adresse constatée de la cote du jour
    chemin_fichier:
    timeout_s: 20
    tentatives_max: 4
    backoff_initial_s: 2
    backoff_facteur: 2
    respecter_robots: true
    cache_minutes: 60
    age_max_minutes: 1440
    # analyseur: voir le bloc commenté de la source suivante.

  - nom: sikafinance
    type: web
    actif: false          # [FAIT] passez à true une fois url_base ET analyseur renseignés
    priorite: 3
    url_base:             # À RENSEIGNER — adresse de la page de cote que vous consultez
    chemin_fichier:
    timeout_s: 20
    tentatives_max: 3
    backoff_initial_s: 2
    backoff_facteur: 2
    respecter_robots: true
    cache_minutes: 120
    age_max_minutes: 2880

    # ------------------------------------------------------------------------
    #  [FAIT] Structure de la page, telle que VOUS la constatez
    # ------------------------------------------------------------------------
    #  Le système ne devine aucune mise en page et n'en fournit aucune : aucun
    #  sélecteur n'a été vérifié par l'auteur du code. Sans ce bloc, la source
    #  refuse de collecter et rappelle la marche à suivre.
    #
    #  Marche à suivre :
    #    python -m brvm.ingestion.capture --plan
    #    python -m brvm.ingestion.capture --config config/config.yaml --source sikafinance
    #    python -m brvm.ingestion.capture --lister-tableaux <fichier capturé>
    #
    #  `index_tableau` est le rang du tableau des cotations dans la page (0 = le
    #  premier). `colonnes` associe chaque en-tête tel qu'il s'affiche à un champ
    #  du système. Champs acceptés : ticker, date_seance, statut_seance,
    #  ouverture, plus_haut, plus_bas, cloture, cours_precedent, volume_titres,
    #  volume_xof, nb_transactions, limite_achat, limite_vente, commentaire.
    #
    #  Les en-têtes ci-dessous sont des NOMS D'EXEMPLE : remplacez-les par ceux
    #  que vous lisez réellement sur la page.
    #
    # analyseur:
    #   type: tableau_html
    #   index_tableau: 0
    #   colonnes:
    #     "<en-tête du code valeur>": ticker
    #     "<en-tête du cours de clôture>": cloture
    #     "<en-tête du cours de la veille>": cours_precedent
    #     "<en-tête du volume>": volume_titres
    #   # Colonnes dont l'information utile est dans le LIEN et non dans le texte.
    #   # Cas courant : la cellule affiche « SONATEL » mais le code de la valeur
    #   # n'existe que dans l'adresse du lien. Le motif est une expression
    #   # régulière à un seul groupe de capture, appliquée à cette adresse.
    #   colonnes_lien:
    #     "<en-tête de la colonne des noms>":
    #       champ: ticker
    #       motif: "cotation_([A-Za-z0-9]+)"
    #   # « colonne » si la page porte une date de séance, sinon « jour_de_collecte ».
    #   date_seance_depuis: jour_de_collecte

  # ----------------------------------------------------------------------------
  #  [FAIT] Troisième forme de source : une API JSON (`type: api_json`)
  # ----------------------------------------------------------------------------
  #  À utiliser quand la source répond en JSON plutôt qu'en HTML. Elle est
  #  interrogée VALEUR PAR VALEUR, sur une fenêtre de dates, à partir du fichier
  #  d'univers : une valeur injoignable n'interrompt pas la collecte des autres.
  #
  #  Comme pour une page, rien n'est deviné : sans bloc `api`, la source refuse
  #  d'exister. Appelez l'API une fois, regardez sa réponse, puis décrivez-la.
  #
  #  Deux pièges à connaître :
  #    • les dates ENVOYÉES et REÇUES n'ont souvent pas le même format, d'où deux
  #      champs distincts. Se tromper ne donne pas une erreur mais une séance
  #      décalée — le connecteur refuse donc toute date non conforme au format
  #      déclaré plutôt que de la réinterpréter ;
  #    • `historique: false` ne retient que la séance visée. Passez-le à true le
  #      temps d'un rattrapage : les barres anciennes seront alors signalées
  #      « périmées », ce qui est attendu.
  #
  # - nom: <votre_api>
  #   type: api_json
  #   actif: false
  #   priorite: 4
  #   url_base:             # À RENSEIGNER — adresse exacte du point d'entrée
  #   chemin_fichier:
  #   timeout_s: 30
  #   tentatives_max: 3
  #   backoff_initial_s: 2
  #   backoff_facteur: 2
  #   respecter_robots: true
  #   cache_minutes: 60
  #   age_max_minutes: 1440
  #   api:
  #     # Chemin pointé menant à la liste d'enregistrements. Vide si la réponse
  #     # est déjà une liste. Un segment numérique indexe une liste.
  #     chemin_liste: <clé de la liste>
  #     # Corps de la requête POST. Vide pour un GET.
  #     # Jetons remplacés à chaque appel : {ticker}, {debut}, {fin}.
  #     corps:
  #       <champ attendu>: "{ticker}"
  #     # Champ de la réponse → champ du système. Champs acceptés : ticker,
  #     # date_seance, statut_seance, ouverture, plus_haut, plus_bas, cloture,
  #     # cours_precedent, volume_titres, volume_xof, nb_transactions,
  #     # limite_achat, limite_vente, commentaire.
  #     champs:
  #       <champ de la réponse>: date_seance
  #       <champ de la réponse>: cloture
  #     format_date: "%d/%m/%Y"          # format des dates REÇUES
  #     format_date_requete: "%Y-%m-%d"  # format des dates ENVOYÉES
  #     # Identifiant attendu par la source. Jetons : {ticker}, {pays}, {pays_bas}.
  #     gabarit_ticker: "{ticker}"
  #     fenetre_jours: 90                # profondeur demandée en une requête
  #     historique: false
  #     # En-têtes que VOUS avez constatés nécessaires. Jeton : {ticker}.
  #     # Le User-Agent n'est pas surchargeable : il vient d'ingestion.
  #     entetes: {}

# ------------------------------------------------------------------------------
#  Barème de frais — [FAIT] TOUT EST À RENSEIGNER
# ------------------------------------------------------------------------------
#  Recopiez ici, ligne à ligne, la grille tarifaire de VOTRE SGI. Le système ne
#  contient aucun barème par défaut et n'en devinera aucun.
#
#  Les lignes sont appliquées par `ordre` croissant. Une ligne assise sur
#  TOTAL_COMMISSIONS (une TVA, typiquement) doit porter un ordre supérieur aux
#  commissions qu'elle taxe.
#
#  base_calcul :
#    MONTANT_BRUT       — assiette = quantité × cours
#    TOTAL_COMMISSIONS  — assiette = somme des lignes d'ordre inférieur
#    MONTANT_FIXE       — forfait, sans taux
#
#  applicable_a : ACHAT | VENTE | LES_DEUX
# ------------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Dépôt public de données BRVM, tenu à jour par un tiers.
  #
  # NIVEAU DE PREUVE : OBSERVÉ. Contrairement aux autres sources de ce fichier,
  # celle-ci a été interrogée pour de vrai depuis l'environnement de
  # développement, et sa structure relevée sur les fichiers réels le 03/09/2026 :
  #   • 49 actions et 18 indices, un dossier par valeur ;
  #   • en-têtes identiques sur les 66 fichiers quotidiens :
  #     Date,Open,High,Low,Close,Volume ;
  #   • dates en AAAA-MM-JJ, cours ENTIERS pour les actions (les indices, eux,
  #     cotent en décimales : ne les mettez pas dans univers.csv) ;
  #   • 158 691 séances de 1998-09-16 à 2026-09-02, dont 40 lignes incohérentes
  #     (plus-haut inférieur à l'ouverture ou à la clôture) que la couche
  #     d'anomalies met en quarantaine d'elle-même ;
  #   • une séance SANS TRANSACTION est ABSENTE du fichier, elle n'y figure pas
  #     à zéro. Le connecteur ne comble rien : c'est le calendrier qui tranche.
  #
  # CE QUI RESTE À VÉRIFIER PAR VOUS :
  #   • les conditions d'utilisation du dépôt et sa licence (aucune n'était
  #     publiée à la date du relevé) ;
  #   • la correspondance des tickers avec la cote officielle, et les
  #     radiations ou introductions postérieures à votre capture d'univers ;
  #   • la fréquence réelle de mise à jour. Le dépôt annonce « toutes les 15
  #     minutes de 9h à 15h UTC en semaine » ; l'en-tête HTTP Last-Modified de
  #     chaque fichier reste le seul juge de son âge réel.
  #
  # CE N'EST PAS UNE SOURCE OFFICIELLE. Recoupez avec la BRVM avant toute
  # décision engageant de l'argent.
  - nom: brvm_data_public
    type: csv_distant
    actif: false          # passez à true après avoir lu ce qui précède
    priorite: 2
    url_base: https://raw.githubusercontent.com/Fredysessie/brvm-data-public/main/data/{ticker}/{ticker}.daily.csv
    timeout_s: 30
    tentatives_max: 3
    backoff_initial_s: 1
    backoff_facteur: 2
    respecter_robots: true
    cache_minutes: 15
    age_max_minutes: 2880   # 2 jours : le dépôt publie la clôture de la veille
    csv_distant:
      colonne_date: Date
      format_date: "%Y-%m-%d"
      # Champ du système → en-tête réellement publié. Relevé sur le fichier,
      # pas supposé : une colonne mal appariée produirait des cours faux.
      colonnes:
        ouverture: Open
        plus_haut: High
        plus_bas: Low
        cloture: Close
        volume_titres: Volume
      # Rattrapage d'historique. Les barres anciennes seront signalées périmées
      # par le contrôle de fraîcheur : c'est attendu.
      historique: true
      profondeur_jours: 500
      # Le dépôt publie le volume en TITRES, jamais en XOF. Or le montant
      # échangé mesure la profondeur du marché, donc la confiance accordée à
      # chaque valeur : sans lui, AUCUNE valeur n'est classable.
      #
      # VÉRIFIÉ le 03/09/2026 : le dépôt calcule lui-même, dans ses fichiers
      # d'instantané, Volume_XOF = Cours × Volume_Titres — exactement, sur les
      # 45 valeurs comparables. C'est cohérent avec le fixing de la BRVM, où
      # une séance se dénoue à un cours unique.
      #
      # Le montant ainsi calculé porte la mention de son origine dans le
      # commentaire de chaque cotation : il ne se confond pas avec un publié.
      volume_xof_depuis_cours: true

frais:
  # À RENSEIGNER — nom de la SGI et date de la grille utilisée. Obligatoire :
  # un barème sans provenance n'est pas auditable.
  source_bareme:
  minimum_perception_global:
  lignes:
    - libelle: Commission de courtage SGI
      base_calcul: MONTANT_BRUT
      ordre: 1
      applicable_a: LES_DEUX
      taux:                    # À RENSEIGNER
      montant_fixe:
      minimum_perception:      # minimum de perception éventuel, en XOF
      maximum_perception:

    - libelle: Commission entreprise de marché
      base_calcul: MONTANT_BRUT
      ordre: 2
      applicable_a: LES_DEUX
      taux:                    # À RENSEIGNER
      montant_fixe:
      minimum_perception:
      maximum_perception:

    - libelle: Commission dépositaire central
      base_calcul: MONTANT_BRUT
      ordre: 3
      applicable_a: LES_DEUX
      taux:                    # À RENSEIGNER
      montant_fixe:
      minimum_perception:
      maximum_perception:

    - libelle: TVA sur commissions
      base_calcul: TOTAL_COMMISSIONS
      ordre: 4
      applicable_a: LES_DEUX
      taux:                    # À RENSEIGNER
      montant_fixe:
      minimum_perception:
      maximum_perception:

    # Ajoutez ou supprimez des lignes selon votre grille réelle. Exemple de ligne
    # forfaitaire, à décommenter et compléter si votre SGI en applique une :
    #
    # - libelle: Frais fixes d'avis d'opéré
    #   base_calcul: MONTANT_FIXE
    #   ordre: 5
    #   applicable_a: LES_DEUX
    #   taux:
    #   montant_fixe:          # À RENSEIGNER, en XOF
    #   minimum_perception:
    #   maximum_perception:

  # ----------------------------------------------------------------------------
  #  Frais récurrents — [FAIT] À RENSEIGNER si votre SGI en perçoit
  # ----------------------------------------------------------------------------
  #  Droits de garde et tenue de compte ne se déclenchent pas à l'achat : ils
  #  courent tant que la ligne est détenue. Les omettre sous-estime le coût réel
  #  de détention, souvent de plusieurs points par an sur un petit portefeuille.
  #  Le système avertit au démarrage si aucun n'est déclaré.
  #
  #  base_calcul : ENCOURS (taux annuel sur la valeur des titres) ou FORFAIT
  #  (montant fixe par période). periodicite : MENSUELLE, TRIMESTRIELLE,
  #  SEMESTRIELLE ou ANNUELLE.
  periodiques: []
  # periodiques:
  #   - libelle: Droits de garde
  #     base_calcul: ENCOURS
  #     periodicite: ANNUELLE
  #     taux:                  # À RENSEIGNER
  #   - libelle: Tenue de compte
  #     base_calcul: FORFAIT
  #     periodicite: TRIMESTRIELLE
  #     montant_fixe:          # À RENSEIGNER, en XOF

# ------------------------------------------------------------------------------
#  Fiscalité — [FAIT] TOUT EST À RENSEIGNER
# ------------------------------------------------------------------------------
fiscalite:
  pays_residence: CI
  # À RENSEIGNER — texte, avis d'imposition ou note de votre SGI d'où viennent
  # les taux ci-dessous.
  source_reference:
  # À RENSEIGNER — retenue à la source sur dividendes, en fraction.
  retenue_dividendes:
  # À RENSEIGNER — true ou false selon votre situation.
  plus_values_imposables:
  # À RENSEIGNER si plus_values_imposables vaut true, sinon laisser vide.
  plus_values_taux:
  # Durée de détention, en mois, au-delà de laquelle la plus-value est exonérée.
  # Laisser vide s'il n'existe pas d'abattement de ce type.
  plus_values_exoneration_mois:

# ------------------------------------------------------------------------------
#  Ingestion — politique commune à tous les connecteurs
# ------------------------------------------------------------------------------

ingestion:
  # [FAIT] À RENSEIGNER — identifiez votre robot auprès des serveurs interrogés :
  # nom de l'outil et un moyen de vous joindre. Un robot anonyme est une
  # impolitesse, et souvent contraire aux conditions d'utilisation de la source.
  # Exemple de forme attendue : "suivi-brvm/0.1 (contact: vous@exemple.org)"
  agent_utilisateur:
  repertoire_cache: ../data/cache
  # Délai minimal entre deux requêtes vers une même source. Ne descendez pas
  # sous une valeur raisonnable : une collecte de fin de séance n'a aucune raison
  # d'être pressée.
  delai_entre_requetes_s: 2
  # [PRÉFÉRENCE] Écart relatif toléré entre le montant échangé annoncé par la
  # source et quantité × cours, avant de signaler une incohérence.
  tolerance_volume_xof: 0.02
  # Mettre en quarantaine une variation supérieure au seuil réglementaire
  # déclaré plus haut dans `marche.seuil_variation_journaliere`.
  quarantaine_si_variation_hors_seuil: true
  # Refuser une cotation datée d'un jour que le calendrier ne reconnaît pas comme
  # une séance : c'est presque toujours le signe d'une analyse de page erronée.
  refuser_seance_hors_calendrier: true
  refuser_date_future: true

# ------------------------------------------------------------------------------
#  Analyse technique — [PRÉFÉRENCE] garde-fous liés à l'illiquidité
# ------------------------------------------------------------------------------
indicateurs:
  # Part minimale de séances RÉELLEMENT COTÉES dans la fenêtre pour qu'un
  # indicateur soit calculé. En deçà, le système refuse de répondre plutôt que de
  # produire une moyenne mobile assise sur du vide.
  ratio_minimum_seances_cotees: 0.60
  # Nombre maximal de séances consécutives que le report de cours peut combler.
  # Au-delà, le trou reste un trou.
  remplissage_max_seances: 3
  fenetre_volume_moyen: 20
  # Au-delà de ce taux de données reportées, le résultat est marqué peu fiable.
  taux_remplissage_alerte: 0.25

  # Fenêtres de calcul. Les valeurs usuelles viennent des marchés liquides :
  # validez-les par backtest avant de vous y fier sur une valeur peu échangée.
  fenetre_mm_courte: 20
  fenetre_mm_longue: 50
  fenetre_mm_fond: 200
  fenetre_rsi: 14
  macd_rapide: 12
  macd_lente: 26
  macd_signal: 9
  fenetre_bollinger: 20
  ecarts_bollinger: 2
  fenetre_atr: 14
  fenetre_momentum: 20
  fenetre_extremes: 60
  rsi_survente: 30
  rsi_surachat: 70
  fourchette_reference: 0.05
  volume_reference_xof: 5000000

# ------------------------------------------------------------------------------
#  Analyse de la cote — [PRÉFÉRENCE] les poids vous appartiennent
# ------------------------------------------------------------------------------
#  Ces valeurs ne sont pas des faits de marché : ce sont VOS jugements, écrits
#  ici plutôt que cachés dans le code. Dire qu'un momentum de +15 % vaut la note
#  maximale est un choix ; il se règle et se valide par backtest.
#
#  Aucun classement produit ici n'est une recommandation. Le système ordonne des
#  valeurs selon des critères mesurés sur des données passées. Il ne prédit rien.
analyse:
  # Données fondamentales, saisies par VOUS depuis les rapports annuels.
  # Tant que ce fichier est vide, tout classement de long terme s'abstient.
  fichier_fondamentaux: ./fondamentaux.csv
  taille_classement: 10

  bornes:
    # Momentum : note nulle en dessous, saturée au-dessus.
    momentum_plancher: -0.15
    momentum_plafond: 0.15
    # RSI : régime jugé normal, et écart toléré de part et d'autre. Un RSI à 15
    # comme à 85 s'éloigne autant du régime, et rien ne dit dans quel sens le
    # cours y reviendra.
    rsi_cible: 50
    rsi_tolerance: 30
    # Écart au plus haut glissant saturant la note de repli.
    ecart_extreme_plafond: 0.30
    # Volatilité annualisée annulant la note. À ajuster après une année de
    # collecte : sur une valeur qui cote une séance sur trois, l'annualisation
    # suppose une continuité qui n'existe pas.
    volatilite_plafond: 0.60
    # Rendement du dividende saturant la note. Au-delà, un rendement très élevé
    # signale plus souvent un cours effondré qu'une aubaine.
    rendement_dividende_plafond: 0.12
    per_plancher: 5
    per_plafond: 25
    price_book_plancher: 0.5
    price_book_plafond: 3

  horizons:
    court_terme:
      libelle: Court terme
      description: >-
        Classe sur la dynamique récente et la capacité à entrer ET sortir.
        Sur cette place, c'est la liquidité qui borne, pas la tendance.
      couverture_minimale: 0.6
      # En dessous de cette confiance, la valeur n'est pas classée du tout :
      # ordonner des séries trouées revient à ordonner du bruit.
      confiance_minimale: 0.25
      exige_fondamentaux: false
      poids:
        momentum: 3
        tendance: 2
        regime_rsi: 1
        repli: 1
        volume: 2

    long_terme:
      libelle: Long terme
      description: >-
        Classe sur le rendement, la valorisation et la régularité du dividende.
        Refuse de classer une valeur dont les comptes ne sont pas saisis.
      couverture_minimale: 0.5
      confiance_minimale: 0.15
      # Sans fondamentaux, ce profil ne retombe PAS sur le prix : classer
      # plusieurs années sur la seule tendance des cours n'aurait pas de sens.
      exige_fondamentaux: true
      poids:
        rendement_dividende: 3
        regularite_dividende: 2
        per: 2
        price_book: 1
        volatilite: 1
        tendance: 1

# ------------------------------------------------------------------------------
#  Allocation — [PRÉFÉRENCE] vos contraintes de construction
# ------------------------------------------------------------------------------
#  Les limites de concentration ne sont PAS redéclarées ici : elles vivent dans
#  `risque`, à un seul endroit. L'allocateur les applique et dit, pour chaque
#  ligne, laquelle a borné sa taille.
allocation:
  lignes_max: 8
  part_liquidites: 0.10
  # En deçà, les frais fixes de votre barème rendent l'opération absurde.
  # Ce seuil dépend de la grille de VOTRE SGI : ajustez-le.
  montant_minimum_ligne: 100000
  # Part des frais dans un ordre au-delà de laquelle il est signalé comme coûteux.
  frais_alerte: 0.02

# ------------------------------------------------------------------------------
#  Risque — [PRÉFÉRENCE]
# ------------------------------------------------------------------------------
risque:
  poids_max_ligne: 0.20
  poids_max_secteur: 0.35
  poids_max_pays: 0.60
  # Une position ne devrait pas dépasser cette part du volume moyen quotidien,
  # sous peine de ne pas pouvoir être débouclée.
  part_max_volume_moyen: 0.25
  fenetre_volume_moyen: 20
  multiple_atr_stop: 2.5
  drawdown_alerte: 0.15
  fenetre_volatilite: 60
  seances_par_an: 250
  # Corrélation au-delà de laquelle deux lignes détenues sont signalées.
  # [PRÉFÉRENCE] Trois lignes de 15 % qui varient ensemble font une position
  # de 45 % qu'aucun contrôle de poids ne voit.
  correlation_alerte: 0.80
  seances_minimum_correlation: 20

# ------------------------------------------------------------------------------
#  Backtest — [PRÉFÉRENCE]
# ------------------------------------------------------------------------------
backtest:
  capital_initial: 1000000
  # Glissement appliqué au cours d'exécution, en fraction. À majorer sur une
  # valeur à fourchette large.
  slippage: 0.005
  # Part maximale du volume de la séance qu'un ordre simulé peut consommer.
  # Au-delà, l'exécution est refusée.
  part_max_volume_seance: 0.10
  execution: OUVERTURE_BARRE_SUIVANTE
  # REFUSER (rigoureux) ou COURS_PRECEDENT (approché) si la source ne
  # publie pas de cours d'ouverture.
  execution_sans_ouverture: REFUSER
  walk_forward_apprentissage: 250
  walk_forward_validation: 60
  taux_sans_risque: 0

# ------------------------------------------------------------------------------
#  Alertes — [PRÉFÉRENCE]
# ------------------------------------------------------------------------------
alertes:
  age_donnee_max_minutes: 1440
  alerter_signal_technique: true
  alerter_seuil_risque: true
  alerter_echec_source: true
  canaux:
    - nom: journal_fichier
      type: fichier
      actif: true
      parametres:
        chemin: ../data/alertes.log
    # - nom: courriel
    #   type: email
    #   actif: false
    #   parametres:
    #     # Tous ces paramètres sont obligatoires : un canal mal réglé ne
    #     # prévient personne, et le système refuse de le construire à moitié.
    #     serveur: smtp.exemple.org
    #     port: "587"
    #     expediteur: robot-brvm@exemple.org
    #     destinataires: vous@exemple.org, associe@exemple.org
    #     # Facultatifs :
    #     utilisateur: robot-brvm@exemple.org
    #     motdepasse: ""          # préférez une variable d'environnement
    #     starttls: "true"
    #     objet_prefixe: "[BRVM]"
    # - nom: webhook
    #   type: webhook
    #   actif: false
    #   parametres:
    #     # https exclusivement : une alerte décrit la composition de votre
    #     # portefeuille, ce qui n'a rien à faire en clair sur le réseau.
    #     url: https://exemple.org/hook
    #     entete_autorisation: "Bearer votre-jeton"

# ------------------------------------------------------------------------------
#  Journalisation — [PRÉFÉRENCE]
# ------------------------------------------------------------------------------
journalisation:
  niveau: INFO
  fichier: ../data/brvm.log
  taille_max_octets: 10485760
  nb_sauvegardes: 5
  format_json: true

# ------------------------------------------------------------------------------
#  Ordonnanceur — [PRÉFÉRENCE]
# ------------------------------------------------------------------------------
ordonnanceur:
  actif: false
  # Collecte de fin de séance, appliquée uniquement les jours de séance.
  # ⚠️ 0 = lundi (comme date.weekday()), pas 0 = dimanche. Les jours ouvrés
  # s'écrivent « 0-4 » ; « 1-5 » désignerait mardi à samedi et sauterait les
  # lundis en silence. L'expression est analysée au chargement de la
  # configuration, pas au premier réveil manqué.
  cron_collecte: "30 15 * * 0-4"
  fuseau_horaire: Africa/Abidjan
