name: Deploy to Vercel Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # `vercel pull` crashes ("Cannot read properties of undefined") when it
      # enumerates teams to link the project. Passing an explicit --scope to
      # `vercel link` skips that code path entirely and writes .vercel/project.json.
      - name: Link Vercel project
        run: |
          vercel whoami --token="$VERCEL_TOKEN" || true
          vercel link --yes --scope marius-projects-92b9e651 --project like-my-self --token="$VERCEL_TOKEN" \
            || vercel link --yes --project like-my-self --token="$VERCEL_TOKEN"
          cat .vercel/project.json
          PROJECT_ID=$(python3 -c "import json; print(json.load(open('.vercel/project.json'))['projectId'])")
          ORG_ID=$(python3 -c "import json; print(json.load(open('.vercel/project.json'))['orgId'])")
          echo "VERCEL_PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
          echo "VERCEL_ORG_ID=$ORG_ID" >> "$GITHUB_ENV"

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build project
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

      # /api/init is self-contained: it runs the DDL migration (via DIRECT_URL
      # or DATABASE_URL) then seeds reference data. No prisma db push needed.
      - name: Initialize database
        run: |
          URL="https://like-my-self.vercel.app"
          echo "Calling /api/init on $URL"
          sleep 10
          RESP=$(curl -s -X POST "$URL/api/init" -H "Content-Type: application/json")
          echo "$RESP" | python3 -c "
          import json, sys
          try:
              d = json.load(sys.stdin)
              print('Init:', d.get('summary', d))
              for e in d.get('errors', [])[:5]:
                  print('  ERREUR:', e)
          except Exception:
              print('Réponse init illisible:', sys.stdin.read()[:200])
          " || true

      - name: Trigger all connectors
        run: |
          URL="https://like-my-self.vercel.app"
          echo "Calling /api/connectors on $URL"
          curl -s --max-time 120 -X POST "$URL/api/connectors" \
            -H "Content-Type: application/json" -d '{"tous":true}' \
            | python3 -c "
          import json, sys
          try:
              d = json.load(sys.stdin)
              rs = d.get('resultats', [])
              ok = sum(1 for r in rs if not r.get('erreur'))
              print(f'{ok}/{len(rs)} connecteurs OK')
              for r in rs:
                  if r.get('erreur'): print(f'  ERREUR {r[\"code\"]}: {r[\"erreur\"][:80]}')
                  else: print(f'  OK {r[\"code\"]}: {r.get(\"nbImportes\", 0)} importés')
          except Exception:
              print('Réponse connecteurs illisible')
          " || echo "Connectors call failed (non-blocking)"
