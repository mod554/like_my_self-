name: Deploy to Vercel Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> $GITHUB_OUTPUT

      - name: Initialize database
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          if [ -z "$URL" ]; then
            URL="https://like-my-self-6825aeud9-marius-projects-92b9e651.vercel.app"
          fi
          echo "Calling /api/init on $URL"
          curl -s -X POST "$URL/api/init" -H "Content-Type: application/json" || echo "Init call failed (may need ADMIN_SECRET)"

      - name: Trigger all connectors
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          if [ -z "$URL" ]; then
            URL="https://like-my-self-6825aeud9-marius-projects-92b9e651.vercel.app"
          fi
          echo "Calling /api/connectors on $URL"
          curl -s -X POST "$URL/api/connectors" -H "Content-Type: application/json" -d '{"tous":true}' || echo "Connectors call failed"
