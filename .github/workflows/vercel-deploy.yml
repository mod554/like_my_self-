name: Deploy to Vercel Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      database_url:
        description: "URL Postgres a upserter dans Vercel (optionnel)"
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # `vercel pull` crashes ("Cannot read properties of undefined") when it
      # enumerates teams to link the project. Passing an explicit --scope to
      # `vercel link` skips that code path entirely and writes .vercel/project.json.
      - name: Verify Vercel token
        run: |
          if ! vercel whoami --token="$VERCEL_TOKEN" 2>&1; then
            echo "::error::VERCEL_TOKEN invalide ou expiré. Créez un nouveau token sur https://vercel.com/account/settings/tokens (scope: marius-projects-92b9e651, expiration: No Expiration) puis mettez à jour le secret VERCEL_TOKEN dans GitHub → Settings → Secrets → Actions."
            exit 1
          fi

      - name: Link Vercel project
        run: |
          vercel link --yes --scope marius-projects-92b9e651 --project like-my-self --token="$VERCEL_TOKEN" \
            || vercel link --yes --project like-my-self --token="$VERCEL_TOKEN"
          cat .vercel/project.json

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      # DATABASE_URL was found malformed in past deploys (P1013: scheme not
      # recognized) and is currently missing at runtime. This step inspects the
      # pulled env file, sanitizes a malformed value (e.g. `psql 'postgres://…'`
      # copied from Supabase), upserts DATABASE_URL + DIRECT_URL via the API,
      # and fails with a clear message if nothing usable exists.
      # When a database_url input is given, probe connection variants from the
      # runner (host clusters, ports, user formats) and keep the working one.
      - name: Probe database connectivity
        if: ${{ inputs.database_url != '' }}
        env:
          INPUT_DATABASE_URL: ${{ inputs.database_url }}
        run: |
          npm install --no-save pg@8 > /dev/null 2>&1
          node - <<'NODEEOF'
          const { Client } = require("pg");
          const raw = process.env.INPUT_DATABASE_URL;
          const m = raw.match(/^postgres(?:ql)?:\/\/([^:]+):(.+)@([^:\/]+):(\d+)\/(.+)$/);
          if (!m) { console.log("URL input illisible"); process.exit(1); }
          const [, user, pass, host, port, db] = m;
          const ref = (user.split(".")[1]) || host.split(".")[0];
          const hosts = [host, "aws-1-eu-west-1.pooler.supabase.com", "aws-0-eu-west-1.pooler.supabase.com"];
          const users = [user, "postgres." + ref, "postgres"];
          const ports = [Number(port), 6543, 5432];
          const seen = new Set();
          const candidates = [];
          for (const h of hosts) for (const u of users) for (const p of ports) {
            const key = h + "|" + u + "|" + p;
            if (!seen.has(key)) { seen.add(key); candidates.push({ h, u, p }); }
          }
          (async () => {
            for (const { h, u, p } of candidates) {
              const c = new Client({ host: h, port: p, user: u, password: decodeURIComponent(pass),
                database: db.split("?")[0], ssl: { rejectUnauthorized: false }, connectionTimeoutMillis: 8000 });
              try {
                await c.connect();
                await c.query("SELECT 1");
                await c.end();
                const url = `postgresql://${u}:${encodeURIComponent(decodeURIComponent(pass))}@${h}:${p}/postgres`;
                console.log(`SUCCES: hote=${h} port=${p} user=${u}`);
                require("fs").appendFileSync(process.env.GITHUB_ENV, `PROBED_DATABASE_URL=${url}\n`);
                process.exit(0);
              } catch (e) {
                console.log(`echec ${h}:${p} ${u} — ${String(e.message).slice(0, 70)}`);
                try { await c.end(); } catch {}
              }
            }
            console.log("::error::Aucune combinaison ne fonctionne — le mot de passe est incorrect ou le projet Supabase est en pause. Verifier sur https://supabase.com/dashboard/project/" + ref);
            process.exit(1);
          })();
          NODEEOF

      - name: Check and repair database env vars
        env:
          INPUT_DATABASE_URL: ${{ inputs.database_url }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, sys, urllib.request

          token = os.environ["VERCEL_TOKEN"]
          proj = json.load(open(".vercel/project.json"))
          pid, org = proj["projectId"], proj["orgId"]

          env_vars = {}
          try:
              for line in open(".vercel/.env.production.local"):
                  line = line.strip()
                  if "=" in line and not line.startswith("#"):
                      k, v = line.split("=", 1)
                      env_vars[k] = v.strip().strip('"')
          except FileNotFoundError:
              pass
          print("Variables presentes:", ", ".join(sorted(env_vars)) or "(aucune)")

          # Priorite: input manuel, puis DATABASE_URL, puis integration Supabase/Neon
          raw = os.environ.get("PROBED_DATABASE_URL", "").strip() or os.environ.get("INPUT_DATABASE_URL", "").strip()
          if raw:
              print("Source retenue: URL sondee/input workflow_dispatch")
          else:
              for cand in ("DATABASE_URL", "POSTGRES_PRISMA_URL", "POSTGRES_URL",
                           "POSTGRES_URL_NON_POOLING", "SUPABASE_DB_URL", "DIRECT_URL"):
                  if env_vars.get(cand):
                      raw = env_vars[cand]
                      print(f"Source retenue: {cand}")
                      break

          m = re.search(r"postgres(?:ql)?://[^'\"\s]+", raw)
          url = m.group(0) if m else ""
          if not url:
              print("::warning::DATABASE_URL absente dans Vercel — deploiement sans DB. Relancer le workflow avec l'input database_url, ou l'ajouter dans Vercel Settings.")
              sys.exit(0)

          host = re.search(r"@([^:/]+)", url)
          port = re.search(r":(\d+)/", url)
          print(f"DATABASE_URL detectee: hote={host.group(1) if host else '?'} port={port.group(1) if port else '?'}")

          if os.environ.get("PROBED_DATABASE_URL") or os.environ.get("INPUT_DATABASE_URL"):
              # URL fraiche validee par la sonde — ne jamais melanger avec le vieux fichier env
              direct = url.replace(":6543/", ":5432/") if ":6543/" in url else url
          else:
              direct_raw = env_vars.get("POSTGRES_URL_NON_POOLING") or env_vars.get("DIRECT_URL") or ""
              dm = re.search(r"postgres(?:ql)?://[^'\"\s]+", direct_raw)
              if dm:
                  direct = dm.group(0)
              else:
                  direct = url.replace(":6543/", ":5432/") if ":6543/" in url else url
          direct = re.sub(r"[?&]pgbouncer=true", "", direct)

          def upsert(key, value):
              body = json.dumps({"key": key, "value": value, "type": "encrypted",
                                 "target": ["production", "preview", "development"]}).encode()
              req = urllib.request.Request(
                  f"https://api.vercel.com/v10/projects/{pid}/env?upsert=true&teamId={org}",
                  data=body, method="POST",
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"})
              with urllib.request.urlopen(req) as r:
                  print(f"  upsert {key}: HTTP {r.status}")

          if raw != url:
              print("Valeur malformee detectee -> reparation")
          upsert("DATABASE_URL", url)
          upsert("DIRECT_URL", direct)
          PYEOF

      - name: Build project
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

      # /api/init is self-contained: it runs the DDL migration (via DIRECT_URL
      # or DATABASE_URL) then seeds reference data. No prisma db push needed.
      - name: Initialize database
        run: |
          URL="https://like-my-self.vercel.app"
          echo "Calling /api/init on $URL"
          sleep 10
          RESP=$(curl -s -X POST "$URL/api/init" -H "Content-Type: application/json")
          echo "$RESP" | python3 -c "
          import json, sys
          try:
              d = json.load(sys.stdin)
              print('Init:', d.get('summary', d))
              for e in d.get('errors', [])[:5]:
                  print('  ERREUR:', e)
          except Exception:
              print('Réponse init illisible:', sys.stdin.read()[:200])
          " || true

      - name: Trigger all connectors
        run: |
          URL="https://like-my-self.vercel.app"
          for code in TAUX_CHANGE_LIVE WORLD_BANK_PINK FAO_FPMA USDA_FAS_PSD CONSEIL_ANACARDE_CI RESIMAO RSS_NEWS_AGRI GDELT_NEWS INDEXMUNDI; do
            RESP=$(curl -s --max-time 90 -X POST "$URL/api/connectors" \
              -H "Content-Type: application/json" -d "{\"code\": \"$code\"}")
            echo "$RESP" | python3 -c "
          import json, sys
          code = '$code'
          try:
              d = json.load(sys.stdin)
              if d.get('erreur') or d.get('error'):
                  print(f'  ERREUR {code}:', str(d.get('erreur') or d.get('error'))[:90])
              else:
                  print(f'  OK {code}: {d.get(\"nbImportes\", 0)} importes, {d.get(\"nbErreurs\", 0)} erreurs')
                  for e in (d.get('erreurs') or [])[:2]:
                      print(f'      - {str(e)[:90]}')
          except Exception:
              print(f'  {code}: reponse illisible (timeout probable)')
          " || true
          done
