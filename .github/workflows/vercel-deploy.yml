name: Deploy to Vercel Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> $GITHUB_OUTPUT

      - name: Apply DB schema via app
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          if [ -z "$URL" ]; then
            URL="https://like-my-self-6825aeud9-marius-projects-92b9e651.vercel.app"
          fi
          echo "Calling /api/migrate on $URL"
          curl -s -X POST "$URL/api/migrate" -H "Content-Type: application/json" \
            | python3 -c "
          import json,sys
          try:
            d=json.load(sys.stdin)
            print(d.get('message','no message'))
            counts=d.get('counts',[])
            if counts: print('Tables:', ', '.join(counts))
            if not d.get('ok'): print('ERROR:', d.get('error','unknown'))
          except Exception as e: print(f'Could not parse: {e}')
          " || echo "Migrate call failed (non-blocking)"

      - name: Initialize reference data
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          if [ -z "$URL" ]; then
            URL="https://like-my-self-6825aeud9-marius-projects-92b9e651.vercel.app"
          fi
          echo "Calling /api/init on $URL"
          curl -s -X POST "$URL/api/init" -H "Content-Type: application/json" \
            | python3 -c "
          import json,sys
          try:
            d=json.load(sys.stdin)
            print(d.get('summary','no summary'))
            errs=d.get('errors',[])
            if errs: print('Errors:', errs[:5])
          except Exception as e: print(f'Could not parse: {e}')
          " || echo "Init call failed (non-blocking)"

      - name: Trigger all connectors
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          if [ -z "$URL" ]; then
            URL="https://like-my-self-6825aeud9-marius-projects-92b9e651.vercel.app"
          fi
          echo "Calling /api/connectors on $URL"
          curl -s -X POST "$URL/api/connectors" \
            -H "Content-Type: application/json" -d '{"tous":true}' \
            | python3 -c "
          import json,sys
          try:
            d=json.load(sys.stdin)
            rs=d.get('resultats',[])
            ok=sum(1 for r in rs if not r.get('erreur'))
            print(f'{ok}/{len(rs)} connectors OK')
            for r in rs:
              if r.get('erreur'): print(f'  ERREUR {r[\"code\"]}: {r[\"erreur\"]}')
              else: print(f'  OK {r[\"code\"]}: {r.get(\"nbImportes\",0)} importés')
          except: print('Could not parse response')
          " || echo "Connectors call failed (non-blocking)"
