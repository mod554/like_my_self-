name: Deploy to Vercel Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> $GITHUB_OUTPUT
          echo "Deployed to: $url"

      - name: Disable Vercel deployment protection & get bypass secret
        id: bypass
        run: |
          echo "Disabling all protection and enabling automation bypass..."
          PROJ_RESP=$(curl -s -X PATCH "https://api.vercel.com/v9/projects/prj_YEV0xwnkNjFBeZmrkGBKGAly77bb?teamId=s7As6xWfTypDaVkuvuPtTBrg" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"ssoProtection":null,"passwordProtection":null,"vercelAuthentication":{"deploymentType":"none"},"deploymentProtectionBypassEnabled":true}')
          echo "$PROJ_RESP" | python3 -c "
          import json,sys
          raw=sys.stdin.read()
          try:
            d=json.loads(raw)
            sso=d.get('ssoProtection')
            pwd=d.get('passwordProtection')
            auth=d.get('vercelAuthentication',{})
            bypass=d.get('autoExposeSystemEnvs')
            print(f'ssoProtection={sso}  passwordProtection={pwd}  vercelAuthentication={auth}')
            secret=d.get('automationBypassSecret','')
            if secret: print(f'bypass_secret={secret}')
          except Exception as e:
            print(f'PATCH response ({e}): {repr(raw[:300])}')
          "
          # Get automation bypass secret from project
          SECRET=$(curl -s "https://api.vercel.com/v9/projects/prj_YEV0xwnkNjFBeZmrkGBKGAly77bb?teamId=s7As6xWfTypDaVkuvuPtTBrg" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            | python3 -c "import json,sys; d=json.loads(sys.stdin.read()); print(d.get('automationBypassSecret',''))" 2>/dev/null || echo "")
          echo "bypass_secret=$SECRET" >> $GITHUB_OUTPUT
          echo "Waiting 5s for protection change to propagate..."
          sleep 5

      - name: Wait for deployment to warm up
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          if [ -z "$URL" ]; then
            URL="https://like-my-self-6825aeud9-marius-projects-92b9e651.vercel.app"
          fi
          BYPASS="${{ steps.bypass.outputs.bypass_secret }}"
          BYPASS_HEADER=""
          if [ -n "$BYPASS" ]; then
            BYPASS_HEADER="-H \"x-vercel-protection-bypass: $BYPASS\""
          fi
          echo "Waiting for $URL to be ready..."
          for i in 1 2 3 4 5; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
              ${BYPASS:+-H "x-vercel-protection-bypass: $BYPASS"} \
              "$URL/api/init")
            echo "Attempt $i: HTTP $status"
            if [ "$status" = "200" ] || [ "$status" = "405" ]; then
              echo "App is ready"
              break
            fi
            sleep 10
          done

      - name: Apply DB schema via app
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          if [ -z "$URL" ]; then
            URL="https://like-my-self-6825aeud9-marius-projects-92b9e651.vercel.app"
          fi
          BYPASS="${{ steps.bypass.outputs.bypass_secret }}"
          echo "Calling /api/migrate on $URL"
          BODY=$(curl -s -L --max-time 60 -X POST \
            ${BYPASS:+-H "x-vercel-protection-bypass: $BYPASS"} \
            -H "Content-Type: application/json" \
            "$URL/api/migrate" \
            -w "\nHTTP_STATUS:%{http_code}")
          HTTP_STATUS=$(echo "$BODY" | grep -o "HTTP_STATUS:[0-9]*" | cut -d: -f2)
          BODY=$(echo "$BODY" | sed '/HTTP_STATUS:/d')
          echo "HTTP status: $HTTP_STATUS"
          echo "$BODY" | python3 -c "
          import json,sys
          raw=sys.stdin.read()
          try:
            d=json.loads(raw)
            print(d.get('message','no message'))
            counts=d.get('counts',[])
            if counts: print('Tables:', ', '.join(counts))
            if not d.get('ok'): print('ERROR:', d.get('error','unknown'))
          except Exception as e:
            print(f'Could not parse ({e}): {repr(raw[:300])}')
          " || echo "Migrate call failed (non-blocking)"

      - name: Initialize reference data
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          if [ -z "$URL" ]; then
            URL="https://like-my-self-6825aeud9-marius-projects-92b9e651.vercel.app"
          fi
          BYPASS="${{ steps.bypass.outputs.bypass_secret }}"
          echo "Calling /api/init on $URL"
          BODY=$(curl -s -L --max-time 60 -X POST \
            ${BYPASS:+-H "x-vercel-protection-bypass: $BYPASS"} \
            -H "Content-Type: application/json" \
            "$URL/api/init" \
            -w "\nHTTP_STATUS:%{http_code}")
          HTTP_STATUS=$(echo "$BODY" | grep -o "HTTP_STATUS:[0-9]*" | cut -d: -f2)
          BODY=$(echo "$BODY" | sed '/HTTP_STATUS:/d')
          echo "HTTP status: $HTTP_STATUS"
          echo "$BODY" | python3 -c "
          import json,sys
          raw=sys.stdin.read()
          try:
            d=json.loads(raw)
            print(d.get('summary','no summary'))
            errs=d.get('errors',[])
            if errs: print('Errors:', errs[:5])
          except Exception as e:
            print(f'Could not parse ({e}): {repr(raw[:300])}')
          " || echo "Init call failed (non-blocking)"

      - name: Trigger all connectors
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          if [ -z "$URL" ]; then
            URL="https://like-my-self-6825aeud9-marius-projects-92b9e651.vercel.app"
          fi
          BYPASS="${{ steps.bypass.outputs.bypass_secret }}"
          echo "Calling /api/connectors on $URL"
          BODY=$(curl -s -L --max-time 300 -X POST \
            ${BYPASS:+-H "x-vercel-protection-bypass: $BYPASS"} \
            -H "Content-Type: application/json" -d '{"tous":true}' \
            "$URL/api/connectors" \
            -w "\nHTTP_STATUS:%{http_code}")
          HTTP_STATUS=$(echo "$BODY" | grep -o "HTTP_STATUS:[0-9]*" | cut -d: -f2)
          BODY=$(echo "$BODY" | sed '/HTTP_STATUS:/d')
          echo "HTTP status: $HTTP_STATUS"
          echo "$BODY" | python3 -c "
          import json,sys
          raw=sys.stdin.read()
          try:
            d=json.loads(raw)
            rs=d.get('resultats',[])
            ok=sum(1 for r in rs if not r.get('erreur'))
            print(f'{ok}/{len(rs)} connectors OK')
            for r in rs:
              if r.get('erreur'): print(f'  ERREUR {r[\"code\"]}: {r[\"erreur\"]}')
              else: print(f'  OK {r[\"code\"]}: {r.get(\"nbImportes\",0)} importes')
          except Exception as e:
            print(f'Could not parse response ({e}): {repr(raw[:300])}')
          " || echo "Connectors call failed (non-blocking)"
