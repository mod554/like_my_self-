name: Deploy to Vercel Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # `vercel pull` crashes ("Cannot read properties of undefined") when it
      # has to list teams to link the project. Pre-linking via the REST API
      # writes .vercel/project.json so the CLI skips that code path entirely.
      - name: Link Vercel project via REST API
        id: link
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request

          token = os.environ["VERCEL_TOKEN"]
          TEAM_SLUG = "marius-projects-92b9e651"

          def api(path):
              req = urllib.request.Request(
                  "https://api.vercel.com" + path,
                  headers={"Authorization": f"Bearer {token}"},
              )
              try:
                  with urllib.request.urlopen(req) as r:
                      return json.load(r)
              except Exception as e:
                  print(f"  {path} -> {e}")
                  return None

          # Scoped tokens 403 without an explicit team scope. Try the known
          # team slug first, then teams listed by the API, then personal scope.
          scopes = [f"slug={TEAM_SLUG}"]
          teams = api(f"/v2/teams?slug={TEAM_SLUG}") or api("/v2/teams") or {}
          for t in teams.get("teams", []):
              scopes.append(f"teamId={t['id']}")
          scopes.append(None)

          project = None
          for scope in scopes:
              q = f"?{scope}" if scope else ""
              d = api(f"/v9/projects/like-my-self{q}")
              if d and "id" in d:
                  project = d
                  break
              sep = "&" if q else "?"
              lst = api(f"/v9/projects{q}{sep}limit=100")
              for pr in (lst or {}).get("projects", []):
                  if "like" in pr["name"].replace("_", "-").replace("--", "-"):
                      project = pr
                      break
              if project:
                  break

          if not project:
              raise SystemExit("Projet Vercel introuvable avec ce token")

          org_id = project.get("accountId")
          os.makedirs(".vercel", exist_ok=True)
          with open(".vercel/project.json", "w") as f:
              json.dump({"projectId": project["id"], "orgId": org_id}, f)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"VERCEL_PROJECT_ID={project['id']}\n")
              f.write(f"VERCEL_ORG_ID={org_id}\n")
          print(f"Linked {project['name']} ({project['id']}) org={org_id}")
          PYEOF

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build project
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

      # /api/init is self-contained: it runs the DDL migration (via DIRECT_URL
      # or DATABASE_URL) then seeds reference data. No prisma db push needed.
      - name: Initialize database
        run: |
          URL="https://like-my-self.vercel.app"
          echo "Calling /api/init on $URL"
          sleep 10
          RESP=$(curl -s -X POST "$URL/api/init" -H "Content-Type: application/json")
          echo "$RESP" | python3 -c "
          import json, sys
          try:
              d = json.load(sys.stdin)
              print('Init:', d.get('summary', d))
              for e in d.get('errors', [])[:5]:
                  print('  ERREUR:', e)
          except Exception:
              print('Réponse init illisible:', sys.stdin.read()[:200])
          " || true

      - name: Trigger all connectors
        run: |
          URL="https://like-my-self.vercel.app"
          echo "Calling /api/connectors on $URL"
          curl -s --max-time 120 -X POST "$URL/api/connectors" \
            -H "Content-Type: application/json" -d '{"tous":true}' \
            | python3 -c "
          import json, sys
          try:
              d = json.load(sys.stdin)
              rs = d.get('resultats', [])
              ok = sum(1 for r in rs if not r.get('erreur'))
              print(f'{ok}/{len(rs)} connecteurs OK')
              for r in rs:
                  if r.get('erreur'): print(f'  ERREUR {r[\"code\"]}: {r[\"erreur\"][:80]}')
                  else: print(f'  OK {r[\"code\"]}: {r.get(\"nbImportes\", 0)} importés')
          except Exception:
              print('Réponse connecteurs illisible')
          " || echo "Connectors call failed (non-blocking)"
