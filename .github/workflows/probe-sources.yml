name: Collecte horaire des données

# Vercel Hobby limite les crons à 1/jour — GitHub Actions prend le relais
# pour des cotations quotidiennes/horaires : taux de change, prix CBOT (Stooq),
# actualités RSS + GDELT toutes les heures ; prix locaux WFP/HDX 2x/jour.

on:
  schedule:
    - cron: "15 * * * *"   # toutes les heures à :15
  workflow_dispatch:
    inputs:
      fetch_assets:
        description: "Télécharger les assets Higgsfield vers design/marche-assets"
        required: false
        type: boolean
        default: false
      debug_page:
        description: "Capturer la stack d'erreur runtime d'une page (ex: /referentiel)"
        required: false
        type: string
        default: ""
      run_connector:
        description: "Déclencher un connecteur précis à la demande (ex: COMTRADE_UN)"
        required: false
        type: string
        default: ""

jobs:
  run-connector:
    if: inputs.run_connector != ''
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher un connecteur unique
        run: |
          echo "Déclenchement du connecteur ${{ inputs.run_connector }}"
          curl -s --max-time 120 -X POST "https://like-my-self.vercel.app/api/connectors" \
            -H "Content-Type: application/json" -d "{\"code\": \"${{ inputs.run_connector }}\"}" \
            | python3 -m json.tool || echo "réponse illisible"

  # Le sandbox Claude Code ne peut pas joindre le CDN Higgsfield (Network
  # Policy figée du conteneur) — le runner GitHub a un egress ouvert : il
  # télécharge les 3 assets et les committe sur la branche design.
  fetch-assets:
    if: inputs.fetch_assets == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/marche-assets
      - name: Télécharger et committer les assets Higgsfield
        run: |
          mkdir -p public/assets/higgsfield assets/higgsfield
          BASE="https://d8j0ntlcm91z4.cloudfront.net/user_395PfotE2gbh2HjWDdSmQjr0B44"
          curl -fsS -o assets/higgsfield/reference-terre-seve.png "$BASE/hf_20260704_213545_c5ec5f4d-a116-4779-a3dc-a70d8be4de88.png"
          curl -fsS -o public/assets/higgsfield/hero-marche-21x9.png "$BASE/hf_20260704_213809_a729aa2c-fd6d-461d-ab6f-51dd5e0dcd71.png"
          curl -fsS -o public/assets/higgsfield/texture-organique-overlay.png "$BASE/hf_20260704_213748_81f7e2e7-8c0e-436c-bd5d-d3091b58e84c.png"
          file assets/higgsfield/*.png public/assets/higgsfield/*.png
          du -h assets/higgsfield/*.png public/assets/higgsfield/*.png
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ public/assets/
          git commit -m "assets: Higgsfield reference + hero 21:9 + texture organique (via runner)"
          git push origin design/marche-assets

  debug-page:
    if: inputs.debug_page != ''
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Capturer les logs runtime pendant le crash
        run: |
          npm install -g vercel@latest >/dev/null 2>&1
          (timeout 45 vercel logs https://like-my-self.vercel.app --token="$VERCEL_TOKEN" --scope marius-projects-92b9e651 > /tmp/vlogs.txt 2>&1 || true) &
          LOGPID=$!
          sleep 6
          echo "== Déclenchement de ${{ inputs.debug_page }} =="
          curl -s -o /dev/null -w "HTTP %{http_code}\n" "https://like-my-self.vercel.app${{ inputs.debug_page }}"
          curl -s -o /dev/null -w "HTTP %{http_code}\n" "https://like-my-self.vercel.app${{ inputs.debug_page }}"
          sleep 20
          kill $LOGPID 2>/dev/null || true
          echo "== LOGS RUNTIME =="
          cat /tmp/vlogs.txt | tail -120

  collecte:
    if: inputs.fetch_assets != true && inputs.debug_page == '' && inputs.run_connector == ''
    runs-on: ubuntu-latest
    steps:
      # Cotation CBOT collectée sur le runner (IP propre) puis poussée vers
      # l'app — les IP partagées Vercel épuisent les quotas Stooq/FRED
      - name: Cotations maïs CBOT depuis le runner
        run: |
          python3 - <<'PYEOF'
          import csv, io, json, urllib.request

          def get(url, timeout=20):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.read().decode("utf-8", "replace")

          points = []
          note = ""

          # 1) Yahoo Finance — ZC=F quotidien (3 mois)
          try:
              d = json.loads(get("https://query1.finance.yahoo.com/v8/finance/chart/ZC=F?range=3mo&interval=1d"))
              res = d["chart"]["result"][0]
              ts = res["timestamp"]
              closes = res["indicators"]["quote"][0]["close"]
              from datetime import datetime, timezone
              for t, c in zip(ts, closes):
                  if c and c > 0:
                      date = datetime.fromtimestamp(t, tz=timezone.utc).strftime("%Y-%m-%d")
                      points.append({"date": date, "usd": round(c / 100 * 39.3683, 2), "cents": round(c, 2)})
              note = "CBOT ZC=F quotidien via Yahoo Finance (GitHub Actions)"
          except Exception as e:
              print("Yahoo indisponible:", str(e)[:80])

          # 2) Stooq (.com puis .pl)
          if not points:
              for host in ("stooq.com", "stooq.pl"):
                  try:
                      body = get(f"https://{host}/q/d/l/?s=zc.f&i=d")
                      rows = list(csv.reader(io.StringIO(body)))
                      for r in rows[1:][-30:]:
                          if len(r) >= 5:
                              try:
                                  c = float(r[4])
                                  if c > 0:
                                      points.append({"date": r[0], "usd": round(c / 100 * 39.3683, 2)})
                              except ValueError:
                                  pass
                      if points:
                          note = f"CBOT ZC quotidien via {host} (GitHub Actions)"
                          break
                      print(f"{host}: reponse non exploitable:", body[:60].replace("\n", " "))
                  except Exception as e:
                      print(f"{host} indisponible:", str(e)[:80])

          # 3) FRED — mensuel (donnees IMF)
          if not points:
              try:
                  body = get("https://fred.stlouisfed.org/graph/fredgraph.csv?id=PMAIZMTUSDM", timeout=30)
                  for line in body.strip().split("\n")[1:][-24:]:
                      d2, v = (line.split(",") + [""])[:2]
                      try:
                          val = float(v)
                          if val > 0:
                              points.append({"date": d2, "usd": val})
                      except ValueError:
                          pass
                  if points:
                      note = "Prix mais mondial mensuel via FRED/IMF (GitHub Actions)"
              except Exception as e:
                  print("FRED indisponible:", str(e)[:80])

          print(f"Points CBOT collectes: {len(points)} — {note}")
          json.dump({"points": points, "sourceNote": note or "n/a", "sourceCode": "YAHOO_FINANCE" if "Yahoo" in note else "USDA_FAS_PSD"}, open("/tmp/points.json", "w"))
          PYEOF
          N=$(python3 -c "import json; print(len(json.load(open('/tmp/points.json'))['points']))")
          if [ "$N" -gt 0 ]; then
            curl -s --max-time 60 -X POST "https://like-my-self.vercel.app/api/import/mais" \
              -H "Content-Type: application/json" \
              ${CRON_SECRET:+-H "Authorization: Bearer $CRON_SECRET"} \
              --data-binary @/tmp/points.json | head -c 300
            echo
          fi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      # Actualités Google News collectées sur le runner (IP propre) — les IP
      # partagées Vercel sont bloquées par Google News RSS (réponse vide).
      - name: Actualités Google News depuis le runner
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request, xml.etree.ElementTree as ET

          def get(url, timeout=20):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.read().decode("utf-8", "replace")

          def gnews(q, lang):
              base = "https://news.google.com/rss/search?q=" + urllib.parse.quote(q)
              return base + ("&hl=fr&gl=FR&ceid=FR:fr" if lang == "fr" else "&hl=en-US&gl=US&ceid=US:en")

          import urllib.parse
          REQUETES = [
              ("MAIS",  gnews("maize OR corn price Africa", "en")),
              ("MAIS",  gnews("maïs prix Afrique de l'Ouest", "fr")),
              ("CAJOU", gnews("cashew OR anacarde price", "en")),
              ("CAJOU", gnews("anacarde cajou Côte d'Ivoire prix", "fr")),
              ("COLA",  gnews('"kola nut" OR "cola nut" price', "en")),
              ("COLA",  gnews("noix de cola Afrique de l'Ouest", "fr")),
          ]
          arts = []
          for filiere, url in REQUETES:
              try:
                  xml = get(url)
                  root = ET.fromstring(xml)
                  for item in root.iter("item"):
                      titre = (item.findtext("title") or "").strip()
                      lien = (item.findtext("link") or "").strip()
                      pub = (item.findtext("pubDate") or "").strip()
                      src_el = item.find("source")
                      src = (src_el.text if src_el is not None else "Google News") or "Google News"
                      if titre and lien:
                          arts.append({"titre": titre, "lien": lien, "source": f"Google News · {src}",
                                       "filiere": filiere, "datePublication": pub})
              except Exception as e:
                  print(f"{filiere}: {str(e)[:70]}")
          print(f"Articles collectés: {len(arts)}")
          json.dump({"articles": arts}, open("/tmp/news.json", "w"))
          PYEOF
          N=$(python3 -c "import json; print(len(json.load(open('/tmp/news.json'))['articles']))")
          if [ "$N" -gt 0 ]; then
            curl -s --max-time 60 -X POST "https://like-my-self.vercel.app/api/import/news" \
              -H "Content-Type: application/json" \
              ${CRON_SECRET:+-H "Authorization: Bearer $CRON_SECRET"} \
              --data-binary @/tmp/news.json | head -c 300
            echo
          fi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Déclencher les connecteurs temps réel
        run: |
          URL="https://like-my-self.vercel.app"
          HEURE=$(date -u +%H)

          # Toutes les heures : taux de change + prix CBOT quotidiens + actualités
          CODES="TAUX_CHANGE_LIVE USDA_FAS_PSD RSS_NEWS_AGRI GDELT_NEWS"

          # 2x/jour (07h et 19h UTC) : prix locaux WFP/HDX + sources officielles
          if [ "$HEURE" = "07" ] || [ "$HEURE" = "19" ]; then
            CODES="$CODES RESIMAO WORLD_BANK_PINK FAO_FPMA CONSEIL_ANACARDE_CI COMTRADE_UN"
          fi

          for code in $CODES; do
            RESP=$(curl -s --max-time 90 -X POST "$URL/api/connectors" \
              -H "Content-Type: application/json" -d "{\"code\": \"$code\"}")
            echo "$RESP" | python3 -c "
          import json, sys
          code = '$code'
          try:
              d = json.load(sys.stdin)
              if d.get('erreur') or d.get('error'):
                  print(f'  ERREUR {code}:', str(d.get('erreur') or d.get('error'))[:90])
              else:
                  print(f'  OK {code}: {d.get(\"nbImportes\", 0)} importes, {d.get(\"nbErreurs\", 0)} erreurs')
          except Exception:
              print(f'  {code}: reponse illisible')
          " || true
          done
